name: Vioro for Open Source Application
description: Apply for 1 free Deep Audit site subscription (€169/mo value) for your non-commercial open-source project.
title: "[OSS Application]: <Project Name>"
labels: ["oss-application"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for applying to **Vioro for Open Source**.
        Before submitting, please:
        1. Start a cardless 14-day **Deep Audit** trial at [app.vioro.io/signup](https://app.vioro.io/signup) on your project domain and complete domain verification.
        2. Place one of the static Vioro SVG badges linking to `https://vioro.io/` on your project site or documentation footer.

        **Privacy note:** Do **not** include personal email addresses in this public issue. We match your Vioro account via your verified domain.
  - type: input
    id: project_name
    attributes:
      label: Project Name
      description: Public name of your open-source project.
      placeholder: e.g. Example CLI
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: Public GitHub repository URL showing commit history and an OSI-approved LICENSE file.
      placeholder: https://github.com/org/repo
    validations:
      required: true
  - type: input
    id: monitored_domain
    attributes:
      label: Monitored Domain
      description: Exact non-commercial project website or documentation domain registered in your Vioro trial.
      placeholder: docs.example.org
    validations:
      required: true
  - type: dropdown
    id: osi_license
    attributes:
      label: OSI-Approved License
      description: Select the primary OSI-approved license from your repository.
      options:
        - MIT
        - Apache-2.0
        - GPL-3.0
        - GPL-2.0
        - AGPL-3.0
        - BSD-3-Clause
        - BSD-2-Clause
        - MPL-2.0
        - ISC
        - Other OSI-Approved License
    validations:
      required: true
  - type: input
    id: badge_url
    attributes:
      label: Badge Placement URL
      description: Public page URL where the Vioro SVG badge is visible.
      placeholder: https://docs.example.org/
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Eligibility & Activation Confirmations
      options:
        - label: This project is non-commercial, actively maintained, and released under an OSI-approved license.
          required: true
        - label: I started a cardless 14-day Deep Audit trial for the monitored domain above and verified domain ownership.
          required: true
        - label: I placed a static Vioro SVG badge linking to https://vioro.io/ on the monitored site (without rel="noreferrer" or nofollow).
          required: true
        - label: I consent to listing our project name, logo, and public link in the Vioro Open Source showcase once approved.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Context (Optional)
      description: Anything else the Vioro team should know when reviewing your project (do not include personal email addresses).
    validations:
      required: false
